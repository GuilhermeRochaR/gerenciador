<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro</title>
  <link rel="stylesheet" href="/gerenciador/frontend/css/financeiro.css">
</head>
<body>
  <div class="header">
    <div><strong>FINANCEIRO</strong></div>
    <div class="user">
      <span>NOME COMPLETO DO USUÁRIO</span>
      <div class="icon">👤</div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-box">
      <div class="form-group">
        <label for="link">LINK:</label>
        <input type="text" id="link" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="numero">NÚMERO:</label>
        <input type="text" id="numero" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="nome">NOME:</label>
        <input type="text" id="nome" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="obs">OBSERVAÇÃO:</label>
        <input type="text" id="obs" placeholder="DIGITE AQUI">
      </div>
      <div class="save-btn-wrapper">
        <button class="save-btn">SALVAR</button>
      </div>
    </div>
  </div>
</body>
</html>
