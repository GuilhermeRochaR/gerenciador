<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartões</title>
  <link rel="stylesheet" href="/gerenciador_atualizado/frontend/css/administracao.css">
</head>
<body>
  <div class="header">
    <div><strong>CARTÕES</strong></div>
    <div class="user">
      <span>NOME COMPLETO DO USUÁRIO</span>
      <div class="icon">👤</div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-box">
      <div class="form-group">
        <label for="nome">NOME</label>
        <input type="text" id="nome" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="cartao">NÚMERO DO CARTÃO:</label>
        <input type="text" id="cartao" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="orgao1">SECRETARIA OU ORGÃO:</label>
        <input type="text" id="orgao1" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="data">DATA PARA O CRÉDITO</label>
        <input type="text" id="data" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="descricao">DESCRIÇÃO (OPCIONAL)</label>
        <textarea id="descricao" class="descricao" placeholder="DIGITE AQUI"></textarea>
      </div>
      
      <div class="form-group">
        <label for="anexos">ANEXAR ARQUIVOS</label>
        <div class="upload-area" id="uploadArea">
          <div class="upload-text">
            📎 Arraste os arquivos aqui ou clique para selecionar
          </div>
          <input type="file" id="fileInput" multiple style="display: none;">
          <div id="fileList" class="file-list"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="save-btn">SALVAR</button>

  <script>
    // Funcionalidade de upload de arquivos
    const uploadArea = document.getElementById("uploadArea");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const saveBtn = document.querySelector(".save-btn");
    let arquivos = [];

    // Event listeners para drag and drop
    uploadArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadArea.classList.add("dragover");
    });

    uploadArea.addEventListener("dragleave", () => {
      uploadArea.classList.remove("dragover");
    });

    uploadArea.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadArea.classList.remove("dragover");
      const files = Array.from(e.dataTransfer.files);
      adicionarArquivos(files);
    });

    // Click para abrir seletor de arquivos
    uploadArea.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files);
      adicionarArquivos(files);
    });

    function adicionarArquivos(files) {
      arquivos.push(...files);
      atualizarListaArquivos();
    }

    function atualizarListaArquivos() {
      fileList.innerHTML = "";
      
      arquivos.forEach((arquivo, index) => {
        const item = document.createElement("div");
        item.className = "file-item-container";
        item.innerHTML = `
          <div class="file-item">
            <span class="file-name">📄 ${arquivo.name}</span>
            <button type="button" onclick="removerArquivo(${index})" class="remove-btn">×</button>
          </div>
        `;
        fileList.appendChild(item);
      });
    }

    function removerArquivo(index) {
      arquivos.splice(index, 1);
      atualizarListaArquivos();
    }

    // Função para formatar tamanho do arquivo
    function formatarTamanho(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Função para obter tipo do arquivo
    function obterTipoArquivo(nomeArquivo) {
      const extensao = nomeArquivo.split('.').pop().toUpperCase();
      return extensao;
    }

    // Função para salvar arquivo no gerenciador
    function salvarArquivoNoGerenciador(arquivo) {
      let arquivosGerenciador = JSON.parse(localStorage.getItem('arquivos_registrados') || '[]');
      arquivosGerenciador.push(arquivo);
      localStorage.setItem('arquivos_registrados', JSON.stringify(arquivosGerenciador));
    }

    // Event listener para o botão salvar
    saveBtn.addEventListener("click", (e) => {
      e.preventDefault();

      // Coletar dados do formulário
      const nome = document.getElementById("nome").value.trim();
      const cpf = document.getElementById("cpf").value.trim();
      const cartao = document.getElementById("cartao").value.trim();
      const orgao = document.getElementById("orgao1").value.trim();
      const dataCredito = document.getElementById("data").value.trim();
      const descricao = document.getElementById("descricao").value.trim();

      // Validar campos obrigatórios
      if (!nome || !cpf || !cartao) {
        alert("Por favor, preencha pelo menos os campos Nome, CPF e Número do Cartão.");
        return;
      }

      const dataEnvio = new Date();
      let arquivosSalvos = 0;

      // Salvar arquivos no gerenciador
      arquivos.forEach((arquivo, index) => {
        // Criar objeto do arquivo para salvar no gerenciador
        const arquivoParaGerenciador = {
          id: Date.now() + index, // ID único
          nome: arquivo.name,
          tipoExclusao: 'manual', // Padrão para cartões
          dataEnvio,
          dataExpiracao: null, // Sem expiração automática
          tamanho: formatarTamanho(arquivo.size),
          tipo: obterTipoArquivo(arquivo.name),
          observacaoArquivo: '',
          origem: 'Cartões', // Identificação clara da origem
          // Dados do cartão associado
          dadosCartao: {
            nome,
            cpf,
            numeroCartao: cartao,
            orgao,
            dataCredito,
            descricao: descricao || 'Sem descrição'
          }
        };

        // Salvar no localStorage para o gerenciador
        salvarArquivoNoGerenciador(arquivoParaGerenciador);
        arquivosSalvos++;
      });

      // Mostrar mensagem de sucesso
      if (arquivosSalvos > 0) {
        alert(`✅ Cartão salvo com sucesso!\n${arquivosSalvos} arquivo(s) enviados para o gerenciador.`);
      } else {
        alert("✅ Cartão salvo com sucesso!");
      }

      // Limpar formulário
      document.getElementById("nome").value = "";
      document.getElementById("cpf").value = "";
      document.getElementById("cartao").value = "";
      document.getElementById("orgao1").value = "";
      document.getElementById("data").value = "";
      document.getElementById("descricao").value = "";
      arquivos = [];
      atualizarListaArquivos();
    });
  </script>
</body>
</html>
