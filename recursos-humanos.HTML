<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursos Humanos</title>
  <link rel="stylesheet" href="/frontend/css/recursos-humanos.css">
  <style>
    /* CSS adicional para drag and drop */
    .upload-area {
      border: 2px dashed #aaa;
      padding: 40px;
      text-align: center;
      color: #555;
      margin: 40px auto;
      width: 90%;
      max-width: 500px;
      background-color: #f5f5f5;
      transition: background-color 0.3s ease;
    }

    .upload-area.dragover {
      background-color: #e0ffe0;
      border-color: #1e5b0d;
    }

    .file-list {
      margin-top: 20px;
      font-size: 14px;
      color: #333;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px;
      border-bottom: 1px solid #ccc;
    }

    .file-item button {
      background-color: #ff6666;
      border: none;
      color: white;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .loading {
      font-style: italic;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="header">
    <div><strong><a href="#" class="link">RECURSOS HUMANOS</a></strong></div>
    <div class="user">
      <span>NOME COMPLETO DO USUÁRIO</span>
      <div class="icon">👤</div>
    </div>
  </div>

  <div class="upload-area" id="uploadArea">
    Arraste o(s) Arquivo(s) aqui ou Clique Aqui
    <div id="fileList" class="file-list"></div>

    
    <input type="file" id="fileInput" multiple style="display: none;">
    <div id="fileList" class="file-list"></div>

  </div>

  <div class="form-container">
    <div class="form-group">
      <label for="pesquisa">NOME DE PESQUISA</label>
      <input type="text" id="pesquisa" placeholder="DIGITE AQUI">
    </div>
    <div class="form-group">
      <label for="observacao">OBSERVAÇÃO</label>
      <input type="text" id="observacao" placeholder="DIGITE AQUI">
    </div>
    <div class="save-btn-wrapper">
      <button class="save-btn" id="btnSalvar" disabled>SALVAR</button>

      <div class="view-btn-wrapper" style="margin-top: 20px;">
        <button class="view-btn" id="btnVisualizar">VISUALIZAR ARQUIVOS</button>
      </div>


      <p id="mensagemSucesso" style="color: green; display: none; margin-top: 10px;">
        ✔️ Arquivos salvos com sucesso!
      </p>
    </div>

  </div>

  <script>

    let arquivosRegistrados = [];


    const uploadArea = document.getElementById("uploadArea");
    const fileList = document.getElementById("fileList");
    let arquivos = [];

    uploadArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadArea.classList.add("dragover");
    });

    uploadArea.addEventListener("dragleave", () => {
      uploadArea.classList.remove("dragover");
    });

    uploadArea.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadArea.classList.remove("dragover");

      const files = Array.from(e.dataTransfer.files);
      if (files.length > 0) {
        mostrarAnimacaoDeCarregamento();

        setTimeout(() => {
          arquivos.push(...files);
          atualizarListaArquivos();
        }, 1000); // Simulando carregamento de 1s
      }
    });

    function mostrarAnimacaoDeCarregamento() {
      fileList.innerHTML = `<p class="loading">Carregando arquivo...</p>`;
    }

    function atualizarListaArquivos() {
      fileList.innerHTML = "";

      arquivos.forEach((arquivo, index) => {
        const item = document.createElement("div");
        item.className = "file-item";
        item.innerHTML = `
          ${arquivo.name}
          <button onclick="removerArquivo(${index})">Excluir</button>
        `;
        fileList.appendChild(item);
      });
    }

    function removerArquivo(index) {
      arquivos.splice(index, 1);
      atualizarListaArquivos();
    }

    const inputPesquisa = document.getElementById("pesquisa");
const btnSalvar = document.getElementById("btnSalvar");
const mensagemSucesso = document.getElementById("mensagemSucesso");

// Verifica se pode ativar o botão
function verificarCampos() {
  const pesquisaPreenchida = inputPesquisa.value.trim() !== "";
  const temArquivos = arquivos.length > 0;

  btnSalvar.disabled = !(pesquisaPreenchida && temArquivos);
}

// Atualiza a lista e verifica os campos
function atualizarListaArquivos() {
  fileList.innerHTML = "";

  arquivos.forEach((arquivo, index) => {
    const item = document.createElement("div");
    item.className = "file-item";
    item.innerHTML = `
      <div style="flex: 1;">
        <strong>${arquivo.name}</strong><br>
        <label>
          <input type="radio" name="exclusao_${index}" value="manual" checked>
          Exclusão manual
        </label>
        <label style="margin-left: 10px;">
          <input type="radio" name="exclusao_${index}" value="automatica">
          Exclusão automática
        </label>
        <div id="anosInput_${index}" style="display: none; margin-top: 5px;">
          <label>Excluir após:
            <input type="number" min="1" max="10" value="2" id="anos_${index}" style="width: 50px;">
            anos
          </label>
          <p id="mensagem_${index}" style="font-size: 12px; color: green;"></p>
        </div>
      </div>
      <button onclick="removerArquivo(${index})">Excluir</button>
    `;

    fileList.appendChild(item);

    // Event listeners para controle da exclusão
    const radios = item.querySelectorAll(`input[name="exclusao_${index}"]`);
    const anosDiv = document.getElementById(`anosInput_${index}`);
    const anosInput = document.getElementById(`anos_${index}`);
    const mensagem = document.getElementById(`mensagem_${index}`);

    radios.forEach(radio => {
      radio.addEventListener("change", () => {
        if (radio.value === "automatica") {
          anosDiv.style.display = "block";
          mensagem.innerText = `Este arquivo será excluído automaticamente em ${anosInput.value} anos`;
        } else {
          anosDiv.style.display = "none";
          mensagem.innerText = "";
        }
        verificarCampos();
      });
    });

    anosInput.addEventListener("input", () => {
      const anos = anosInput.value;
      mensagem.innerText = `Este arquivo será excluído automaticamente em ${anos} ano${anos == 1 ? "" : "s"}`;
    });
  });

  verificarCampos();
}


function removerArquivo(index) {
  arquivos.splice(index, 1);
  atualizarListaArquivos();
}

// Verifica em tempo real ao digitar no campo
inputPesquisa.addEventListener("input", verificarCampos);

// Clique no botão SALVAR
btnSalvar.addEventListener("click", (e) => {
  e.preventDefault();

  const dataEnvio = new Date();
  arquivos.forEach((arquivo, index) => {
    const tipoExclusao = document.querySelector(`input[name="exclusao_${index}"]:checked`).value;
    let anos = null;
    let dataExpiracao = null;

    if (tipoExclusao === "automatica") {
      anos = parseInt(document.getElementById(`anos_${index}`).value);
      dataExpiracao = new Date(dataEnvio);
      dataExpiracao.setFullYear(dataEnvio.getFullYear() + anos);
    }

    arquivosRegistrados.push({
      nome: arquivo.name,
      tipoExclusao,
      dataEnvio,
      dataExpiracao,
      conteudo: arquivo // simulação
    });
  });

  mensagemSucesso.style.display = "block";
  arquivos = [];
  atualizarListaArquivos();
  inputPesquisa.value = "";
  verificarCampos();
});


// Código da área drag and drop pra caso ela seja clicada

const fileInput = document.getElementById("fileInput");

// Permitir clicar na área para abrir o explorador de arquivos
uploadArea.addEventListener("click", (e) => {
  // Se o clique for dentro de um input, label ou botão, não faz nada
  const ignorarTags = ["INPUT", "LABEL", "BUTTON"];
  if (ignorarTags.includes(e.target.tagName)) return;

  // Se clicou em área "neutra", abre o explorador de arquivos
  fileInput.click();
});


// Quando arquivos forem escolhidos pelo input
fileInput.addEventListener("change", (event) => {
  const files = Array.from(event.target.files);

  if (files.length > 0) {
    mostrarAnimacaoDeCarregamento();

    setTimeout(() => {
      arquivos.push(...files);
      atualizarListaArquivos();
      fileInput.value = ""; // limpa o input pra permitir novo envio
    }, 1000);
  }
});



document.getElementById("btnVisualizar").addEventListener("click", () => {
  const area = document.getElementById("areaVisualizacao");
  const lista = document.getElementById("listaArquivosRegistrados");

  if (arquivosRegistrados.length === 0) {
    lista.innerHTML = "<p>Nenhum arquivo registrado ainda.</p>";
  } else {
lista.innerHTML = arquivosRegistrados.map((arquivo, index) => {
  const envio = arquivo.dataEnvio.toLocaleDateString("pt-BR");
  const expiracao = arquivo.dataExpiracao
    ? arquivo.dataExpiracao.toLocaleDateString("pt-BR")
    : "—";

  return `
    <div style="border-bottom: 1px solid #ccc; padding: 10px 0;">
      <strong>📄 ${arquivo.nome}</strong><br>
      Tipo de exclusão: <em>${arquivo.tipoExclusao}</em><br>
      Enviado em: ${envio}<br>
      Expira em: ${expiracao}<br>

      <button disabled style="margin-top: 5px;">⬇️ Baixar</button>
      <button onclick="excluirArquivoRegistrado(${index})" style="background-color:#ff6666; color:white; border:none; padding:5px 10px; margin-left:10px; border-radius:4px;">🗑️ Excluir</button>
      <button onclick="editarDataExpiracao(${index})" style="background-color:#007bff; color:white; border:none; padding:5px 10px; margin-left:10px; border-radius:4px;">✏️ Editar Data</button>

      <div id="editarArea_${index}" style="margin-top: 5px; display: none;">
        <input type="number" id="novosAnos_${index}" value="2" min="1" max="10" style="width: 60px;">
        <button onclick="salvarNovaData(${index})" style="background-color:green; color:white; border:none; padding:5px 10px; margin-left:5px; border-radius:4px;">Salvar</button>
      </div>
    </div>
  `;
}).join("");



  }

  area.style.display = "block";
});

function excluirArquivoRegistrado(index) {
  if (confirm("Tem certeza que deseja excluir este arquivo?")) {
    arquivosRegistrados.splice(index, 1);
    document.getElementById("btnVisualizar").click(); // Reatualiza a visualização
  }
}


function editarDataExpiracao(index) {
  const area = document.getElementById(`editarArea_${index}`);
  area.style.display = area.style.display === "none" ? "block" : "none";
}

function salvarNovaData(index) {
  const anos = parseInt(document.getElementById(`novosAnos_${index}`).value);
  const novaData = new Date(arquivosRegistrados[index].dataEnvio);
  novaData.setFullYear(novaData.getFullYear() + anos);
  arquivosRegistrados[index].dataExpiracao = novaData;

  alert(`Nova data de expiração salva para ${anos} ano(s).`);
  document.getElementById("btnVisualizar").click(); // Reatualiza a lista
}



  </script>

  <div id="areaVisualizacao" style="display:none; margin: 30px auto; width: 90%; max-width: 700px;">
  <h3>📁 Arquivos Registrados</h3>
  <div id="listaArquivosRegistrados"></div>
</div>

</body>
</html>
