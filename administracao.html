<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartões</title>
  <link rel="stylesheet" href="frontend/css/administracao.css">
</head>
<body>
  <div class="header">
    <div><strong>CARTÕES</strong></div>
    <div class="user">
      <span>NOME COMPLETO DO USUÁRIO</span>
      <div class="icon">👤</div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-box">
      <div class="form-group">
        <label for="nome">NOME</label>
        <input type="text" id="nome" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="cartao">NÚMERO DO CARTÃO:</label>
        <input type="text" id="cartao" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="orgao1">SECRETARIA OU ORGÃO:</label>
        <input type="text" id="orgao1" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="data">DATA PARA O CRÉDITO</label>
        <input type="text" id="data" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="descricao">DESCRIÇÃO (OPCIONAL)</label>
        <textarea id="descricao" class="descricao" placeholder="DIGITE AQUI"></textarea>
      </div>
      
      <div class="form-group">
        <label for="anexos">ANEXAR ARQUIVOS</label>
        <div class="upload-area" id="uploadArea">
          <div class="upload-text">
            📎 Arraste os arquivos aqui ou clique para selecionar
          </div>
          <input type="file" id="fileInput" multiple style="display: none;">
          <div id="fileList" class="file-list"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="save-btn">SALVAR</button>

  <script>
    // Função para registrar atividades (ADICIONADO)
    function registrarAtividade(acao, detalhes = {}) {
      const logs = JSON.parse(localStorage.getItem('systemLogs') || '[]');
      const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
      
      logs.push({
        timestamp: new Date().toLocaleString("pt-BR", {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        }),
        user: {
          username: user.username || 'Sistema',
          name: user.name || 'Usuário não identificado'
        },
        action: acao,
        details: detalhes,
        location: 'administracao.html'
      });
      
      localStorage.setItem('systemLogs', JSON.stringify(logs));
    }

    // Funcionalidade de upload de arquivos (ORIGINAL)
    const uploadArea = document.getElementById("uploadArea");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const saveBtn = document.querySelector(".save-btn");
    let arquivos = [];

    // Event listeners para drag and drop (ORIGINAL)
    uploadArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadArea.classList.add("dragover");
    });

    uploadArea.addEventListener("dragleave", () => {
      uploadArea.classList.remove("dragover");
    });

    uploadArea.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadArea.classList.remove("dragover");
      const files = Array.from(e.dataTransfer.files);
      adicionarArquivos(files);
    });

    // Click para abrir seletor de arquivos (MODIFICADO)
    uploadArea.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files);
      registrarAtividade('Arquivos selecionados', {  // ADICIONADO
        quantidade: files.length,
        tipos: [...new Set(files.map(f => f.name.split('.').pop()))]
      });
      adicionarArquivos(files);
    });

    function adicionarArquivos(files) {
      arquivos.push(...files);
      atualizarListaArquivos();
    }

    function atualizarListaArquivos() {
      fileList.innerHTML = "";
      
      arquivos.forEach((arquivo, index) => {
        const item = document.createElement("div");
        item.className = "file-item-container";
        item.innerHTML = `
          <div class="file-item">
            <span class="file-name">📄 ${arquivo.name}</span>
            <button type="button" onclick="removerArquivo(${index})" class="remove-btn">×</button>
          </div>
        `;
        fileList.appendChild(item);
      });
    }

    // Função para remover arquivo (MODIFICADA)
    window.removerArquivo = function(index) {
      registrarAtividade('Arquivo removido', {  // ADICIONADO
        nome: arquivos[index].name,
        tamanho: arquivos[index].size
      });
      arquivos.splice(index, 1);
      atualizarListaArquivos();
    };

    // Funções auxiliares (ORIGINAL)
    function formatarTamanho(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function obterTipoArquivo(nomeArquivo) {
      const extensao = nomeArquivo.split('.').pop().toUpperCase();
      return extensao;
    }

    function salvarArquivoNoGerenciador(arquivo) {
      let arquivosGerenciador = JSON.parse(localStorage.getItem('arquivos_registrados') || '[]');
      arquivosGerenciador.push(arquivo);
      localStorage.setItem('arquivos_registrados', JSON.stringify(arquivosGerenciador));
    }

    // Event listener para o botão salvar (MODIFICADO)
    saveBtn.addEventListener("click", (e) => {
      e.preventDefault();

      // Coletar dados do formulário (ORIGINAL)
      const nome = document.getElementById("nome").value.trim();
      const cpf = document.getElementById("cpf").value.trim();
      const cartao = document.getElementById("cartao").value.trim();
      const orgao = document.getElementById("orgao1").value.trim();
      const dataCredito = document.getElementById("data").value.trim();
      const descricao = document.getElementById("descricao").value.trim();

      // Validar campos obrigatórios (MODIFICADO)
      if (!nome || !cpf || !cartao) {
        registrarAtividade('Tentativa de cadastro inválida', {  // ADICIONADO
          motivo: 'Campos obrigatórios faltando',
          camposPreenchidos: { nome: !!nome, cpf: !!cpf, cartao: !!cartao }
        });
        alert("Por favor, preencha pelo menos os campos Nome, CPF e Número do Cartão.");
        return;
      }

      registrarAtividade('Início do processamento de cartão', {  // ADICIONADO
        dados: {
          nome: nome.substring(0, 1) + '***', // Ofusca nome
          cpf: cpf.substring(0, 3) + '***',  // Ofusca CPF
          cartao: cartao.slice(-4) + '****'  // Ofusca cartão
        }
      });

      const dataEnvio = new Date();
      let arquivosSalvos = 0;

      // Salvar arquivos no gerenciador (ORIGINAL)
      arquivos.forEach((arquivo, index) => {
        const arquivoParaGerenciador = {
          id: Date.now() + index,
          nome: arquivo.name,
          tipoExclusao: 'manual',
          dataEnvio,
          dataExpiracao: null,
          tamanho: formatarTamanho(arquivo.size),
          tipo: obterTipoArquivo(arquivo.name),
          observacaoArquivo: '',
          origem: 'Cartões',
          dadosCartao: {
            nome,
            cpf,
            numeroCartao: cartao,
            orgao,
            dataCredito,
            descricao: descricao || 'Sem descrição'
          }
        };

        salvarArquivoNoGerenciador(arquivoParaGerenciador);
        arquivosSalvos++;
      });

      // Mostrar mensagem de sucesso (ORIGINAL)
      if (arquivosSalvos > 0) {
        registrarAtividade('Cartão salvo com arquivos', {  // ADICIONADO
          totalArquivos: arquivosSalvos,
          tiposArquivos: [...new Set(arquivos.map(f => f.name.split('.').pop()))]
        });
        alert(`✅ Cartão salvo com sucesso!\n${arquivosSalvos} arquivo(s) enviados para o gerenciador.`);
      } else {
        registrarAtividade('Cartão salvo sem arquivos');  // ADICIONADO
        alert("✅ Cartão salvo com sucesso!");
      }

      // Limpar formulário (ORIGINAL)
      document.getElementById("nome").value = "";
      document.getElementById("cpf").value = "";
      document.getElementById("cartao").value = "";
      document.getElementById("orgao1").value = "";
      document.getElementById("data").value = "";
      document.getElementById("descricao").value = "";
      arquivos = [];
      atualizarListaArquivos();
    });
  </script>
</body>
</html>
