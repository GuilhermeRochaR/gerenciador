<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração</title>
  <link rel="stylesheet" href="/frontend/css/administracao.css">
</head>
<body>
  <div class="header">
    <div><strong>ADMINISTRAÇÃO</strong></div>
    <div class="user">
      <span>NOME COMPLETO DO USUÁRIO</span>
      <div class="icon">👤</div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-box">
      <div class="form-group">
        <label for="nome">NOME</label>
        <input type="text" id="nome" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="cartao">NÚMERO DO CARTÃO:</label>
        <input type="text" id="cartao" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="orgao1">SECRETARIA OU ORGÃO:</label>
        <input type="text" id="orgao1" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="data">DATA PARA O CRÉDITO</label>
        <input type="text" id="data" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="descricao">DESCRIÇÃO</label>
        <textarea id="descricao" class="descricao" placeholder="DIGITE AQUI"></textarea>
      </div>
    </div>
  </div>

  <button class="save-btn">SALVAR</button>
</body>
</html>
