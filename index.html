<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="frontend/css/index.css">

  <meta name="referrer" content="no-referrer"> <!-- Evita problemas com CORS em alguns casos -->

</head>
<body>

  <header class="header">
    <div class="titulo">LOGIN</div>
    <img src="frontend/css/img/logopresistema.png" alt="Logo" class="logo">   
  </header>
 
  <div id="info-localizacao" style="font-size: 12px; color: gray; margin-top: 10px;"></div>

  <div class="login-container">
    <div class="login-box">
      <div class="login-top-bar">
        <span class="home-icon">🏠</span>
      </div>
      <div class="form" id="loginForm">
        <label for="usuario">USUÁRIO</label>
        <input type="text" id="usuario" placeholder="USUÁRIO">

        <label for="senha">SENHA</label>
        <input type="password" id="senha" placeholder="SENHA">

        <button class="btn-entrar" id="btnEntrar">ENTRAR</button>

      </div>
    </div>
  </div>

 <!-- Após a fase de testes, essa div abaixo pode ser removida para que os dados da --> 
<div id="localizacao" style="margin-top: 15px; font-size: 14px; color: gray;"></div>

<script src="script.js/script.js"></script>

</body>
</html>
