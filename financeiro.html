<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro</title>
  <link rel="stylesheet" href="/frontend/css/financeiro.css">
</head>
<body>
  <div class="header">
    <div><strong>FINANCEIRO</strong></div>
    <div class="user">
      <span>NOME COMPLETO DO USUÁRIO</span>
      <div class="icon">👤</div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-box">
      <div class="form-group">
        <label for="link">LINK:</label>
        <input type="text" id="link" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="numero">NÚMERO:</label>
        <input type="text" id="numero" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="nome">NOME:</label>
        <input type="text" id="nome" placeholder="DIGITE AQUI">
      </div>
      <div class="form-group">
        <label for="obs">OBSERVAÇÃO:</label>
        <input type="text" id="obs" placeholder="DIGITE AQUI">
      </div>
      <div class="save-btn-wrapper">
        <button class="save-btn">SALVAR</button>
      </div>
    </div>
  </div>

  <script type="module">
    import logger from './logger.js';
    
    document.querySelector('.save-btn').addEventListener('click', function(e) {
      e.preventDefault();
      
      const formData = {
        link: document.getElementById('link').value,
        numero: document.getElementById('numero').value,
        nome: document.getElementById('nome').value,
        obs: document.getElementById('obs').value
      };

      // Validar campos obrigatórios
      if (!formData.link || !formData.numero) {
        logger.log('Tentativa de registro financeiro inválida', {
          motivo: 'Campos obrigatórios faltando',
          dados: formData
        });
        alert('Por favor, preencha pelo menos os campos Link e Número');
        return;
      }

      // Registrar ação
      logger.log('Registro financeiro salvo', {
        tipo: 'Financeiro',
        dados: formData
      });

      alert('Dados salvos com sucesso!');
      
      // Limpar formulário
      document.getElementById('link').value = '';
      document.getElementById('numero').value = '';
      document.getElementById('nome').value = '';
      document.getElementById('obs').value = '';
    });
  </script>
</body>
</html>
